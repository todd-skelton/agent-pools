[package]
name = "pools-shadow"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true
publish = false
description = "Agent Pools' dashboard and /api/summary on Corten, read-only beside the live service, with a running parity check against it."

[dependencies]
pool-core = { path = "../pool-core" }
# main after "corten::serve_on serves an app on listeners of its own" (corten#137, for corten#115)
# and "An area or an API sets its own deadline" (corten#135, for corten#114).
corten = { git = "https://github.com/todd-skelton/corten", rev = "15dc546", features = ["json"] }
# The dashboard's live stream (corten::live takes a Stream).
futures-util = { version = "0.3", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
# The live service's /api/summary, over plain HTTP on loopback (no TLS stack).
reqwest = { version = "0.12", default-features = false, features = ["json"] }
[dev-dependencies]
flate2 = "1"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
