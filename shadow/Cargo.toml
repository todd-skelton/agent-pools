[package]
name = "pools-shadow"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true
publish = false
description = "Agent Pools' dashboard and /api/summary on Corten, read-only beside the live service, with a running parity check against it."

[dependencies]
pool-core = { path = "../pool-core" }
# The desktop relay on a copy (backend-relay.mjs), on the same Corten revision.
pools-gateway = { path = "../gateway" }
# main with Upgrade and Relay (corten#162), ClientIp (corten#145), serve_on (corten#137) and per-area deadlines (corten#135).
# `compress`: pages, JSON and the dashboard's live stream compressed per connection (zstd, brotli).
corten = { git = "https://github.com/todd-skelton/corten", rev = "1149c5a", features = ["json", "compress"] }
# The dashboard's live stream (corten::live takes a Stream).
futures-util = { version = "0.3", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "process", "signal"] }
# Live mode (src/live): the desktop and inference relays over TLS from state/certs, as Agent Pools
# serves them (rustls with ring, already in the tree through reqwest).
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# make-rehearsal's self-signed pair for the relays (no certificate store touched).
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem", "crypto"] }
# A Claude claim's request id on the copy's write side.
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
# The live service's /api/summary, over plain HTTP on loopback (no TLS stack).
reqwest = { version = "0.12", default-features = false, features = ["json"] }
# The stand-in's WebSocket for /v1/responses (all three already in Corten's and the gateway's tree).
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
# Live mode's process checks (alive, kill, priority), as Node's process.kill and os.setPriority do
# them; already in the tree through tokio.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock"] }

[dev-dependencies]
# The refresh loop's tests run on a paused clock.
tokio = { version = "1", features = ["test-util"] }
flate2 = "1"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
