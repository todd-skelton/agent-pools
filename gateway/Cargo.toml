[package]
name = "pools-gateway"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true
publish = false
description = "Agent Pools' public gateway (public-gateway.mjs), inference relay (inference-relay.mjs) and backend relay (backend-relay.mjs) on Corten."

[dependencies]
pool-core = { path = "../pool-core" }
# main with Upgrade, Switch and Relay (corten#162, for corten#117).
corten = { git = "https://github.com/todd-skelton/corten", rev = "6b86352", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
futures-util = { version = "0.3", default-features = false }
# The pool and the service, over plain HTTP on loopback, bodies streamed both ways; the backend
# relay's upstream (chatgpt.com) over TLS, and its WebSocket handshake switched (Response::upgrade).
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
form_urlencoded = "1"
# The inference relay: WebSocket frames both ways (Corten hands over the connection), and zstd
# request bodies as Codex sends them.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
zstd = "0.13"

[dev-dependencies]
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
