<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Agent pools</title>
<style>
:root {
  color-scheme: dark;
  --bg: #0c131a; --panel: #121c25; --panel2: #16222d; --raise: #1b2935;
  --line: #22313e; --line2: #2e4152;
  --text: #e7eef4; --mut: #94a7b7; --dim: #677c8d;
  --ok: #5fd0a8; --okbg: rgba(95,208,168,.12);
  --warn: #f2c06b; --warnbg: rgba(242,192,107,.12);
  --bad: #f08a78; --badbg: rgba(240,138,120,.13);
  --info: #86b4ff; --infobg: rgba(134,180,255,.12);
  --claude: #e9a47c; --codex: #8db7ff;
  --r: 12px;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: var(--info); }
h1, h2, h3, h4 { margin: 0; font-weight: 600; }
.mono { font-variant-numeric: tabular-nums; }
.mut { color: var(--mut); } .dim { color: var(--dim); }

/* Top bar */
.bar { position: sticky; top: 0; z-index: 20; background: rgba(12,19,26,.92); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.bar-in { max-width: 1280px; margin: 0 auto; padding: 0 24px; display: flex; align-items: center; gap: 24px; height: 58px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 15px; white-space: nowrap; }
.logo { width: 22px; height: 22px; border-radius: 6px; background: linear-gradient(135deg, var(--claude), var(--codex)); }
nav.tabs { display: flex; gap: 2px; height: 100%; }
nav.tabs a { display: flex; align-items: center; gap: 7px; padding: 0 14px; color: var(--mut); text-decoration: none; border-bottom: 2px solid transparent; font-weight: 500; white-space: nowrap; }
nav.tabs a:hover { color: var(--text); }
nav.tabs a[aria-current="page"] { color: var(--text); border-bottom-color: var(--text); }
.tab-count { font-size: 11px; padding: 1px 6px; border-radius: 9px; background: var(--badbg); color: var(--bad); font-weight: 650; }
.bar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.fresh { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--mut); white-space: nowrap; }
.pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px var(--okbg); }
.btn { border: 1px solid var(--line2); background: var(--raise); border-radius: 8px; padding: 7px 12px; font-weight: 550; font-size: 13px; white-space: nowrap; }
.btn:hover { border-color: #47607a; }
.btn.primary { background: var(--text); color: #0c131a; border-color: var(--text); }
.btn.primary:hover { background: #fff; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--mut); padding: 7px 8px; }
.btn.ghost:hover { color: var(--text); background: var(--raise); }
.btn.sm { padding: 5px 10px; font-size: 12px; }

main { max-width: 1280px; margin: 0 auto; padding: 20px 24px 64px; }
section.view { display: none; } section.view.on { display: block; }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(12, 1fr); }
.span-12 { grid-column: span 12; } .span-7 { grid-column: span 7; } .span-5 { grid-column: span 5; } .span-6 { grid-column: span 6; } .span-4 { grid-column: span 4; } .span-8 { grid-column: span 8; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); }
.card-h { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.card-h h2 { font-size: 14px; }
.card-h .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.card-b { padding: 16px; }
.eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--dim); font-weight: 600; }

/* Chips */
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip.ok { color: var(--ok); background: var(--okbg); } .chip.warn { color: var(--warn); background: var(--warnbg); }
.chip.bad { color: var(--bad); background: var(--badbg); } .chip.info { color: var(--info); background: var(--infobg); }
.chip.neutral { color: var(--mut); background: var(--raise); }
.chip.plain::before { display: none; }
.pdot { display: inline-block; width: 8px; height: 8px; border-radius: 2px; flex: none; }
.pdot.claude { background: var(--claude); } .pdot.codex { background: var(--codex); }

/* Attention */
.att-list { list-style: none; margin: 0; padding: 0; }
.att { display: grid; grid-template-columns: 4px 1fr auto; gap: 0 14px; padding: 14px 16px 14px 0; border-bottom: 1px solid var(--line); align-items: start; }
.att:last-child { border-bottom: 0; }
.att .rail { align-self: stretch; border-radius: 0 3px 3px 0; }
.att.bad .rail { background: var(--bad); } .att.warn .rail { background: var(--warn); } .att.info .rail { background: var(--info); }
.att h3 { font-size: 14px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.att p { margin: 3px 0 0; color: var(--mut); font-size: 13px; max-width: 760px; }
.att .acts { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.att details { grid-column: 2 / 4; margin-top: 8px; }
.att summary { color: var(--dim); font-size: 12px; cursor: pointer; width: max-content; }
.att summary:hover { color: var(--mut); }
.att details p { font-size: 12px; color: var(--mut); border-left: 2px solid var(--line2); padding-left: 10px; margin-top: 6px; }
.clear { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); background: var(--panel2); border-radius: 0 0 var(--r) var(--r); }

/* Provider cards */
.prov-h { display: flex; align-items: center; gap: 10px; }
.prov-h h2 { font-size: 16px; }
.big { display: flex; align-items: baseline; gap: 8px; margin: 14px 0 4px; }
.big b { font-size: 30px; font-weight: 650; letter-spacing: -.02em; }
.supply { display: flex; gap: 3px; height: 10px; margin: 10px 0 4px; }
.supply span { position: relative; border-radius: 3px; background: var(--line2); overflow: hidden; }
.supply span i { position: absolute; inset: 0 auto 0 0; border-radius: 3px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin: 16px 0; }
.stat { background: var(--panel2); padding: 10px 12px; }
.stat .v { font-size: 15px; font-weight: 600; margin-top: 2px; }
.stat .s { font-size: 12px; color: var(--mut); }
.stat.bad .v { color: var(--bad); } .stat.warn .v { color: var(--warn); } .stat.ok .v { color: var(--ok); }
.acct { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) 76px 64px; gap: 12px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); font-size: 13px; }
.acct .name { display: flex; align-items: center; gap: 8px; min-width: 0; }
.acct .name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.next { font-size: 10px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--ok); border: 1px solid rgba(95,208,168,.35); border-radius: 4px; padding: 0 4px; flex: none; }
.meter { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
.meter .track { flex: 1; height: 6px; border-radius: 6px; background: var(--line2); overflow: hidden; min-width: 40px; }
.meter .fill { height: 100%; border-radius: 6px; background: var(--ok); }
.meter .fill.warn { background: var(--warn); } .meter .fill.bad { background: var(--bad); }
.meter .pct { width: 34px; text-align: right; font-variant-numeric: tabular-nums; font-size: 12px; }
.credit { font-size: 12px; color: var(--mut); text-align: right; white-space: nowrap; }
.credit b { color: var(--text); }
.when { font-size: 12px; color: var(--mut); white-space: nowrap; text-align: right; font-variant-numeric: tabular-nums; }

/* Timeline */
.tl { position: relative; }
.tl-row { display: grid; grid-template-columns: 200px 1fr; align-items: center; min-height: 30px; }
.tl-row.group { min-height: 34px; margin-top: 6px; }
.tl-row.group .lbl { font-weight: 600; display: flex; gap: 8px; align-items: center; }
.tl-row .lbl { font-size: 12px; color: var(--mut); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 12px; }
.track2 { position: relative; height: 30px; }
.tl-row:not(.group) .track2::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 1px dashed var(--line2); }
.tl-axis { display: grid; grid-template-columns: 200px 1fr; }
.ticks { position: relative; height: 28px; }
.tick { position: absolute; top: 6px; font-size: 11px; color: var(--dim); transform: translateX(-50%); white-space: nowrap; }
.gridlines { position: absolute; left: 200px; right: 0; top: 0; bottom: 0; pointer-events: none; }
.gl { position: absolute; top: 28px; bottom: 0; border-left: 1px solid var(--line); }
.gl.wknd { background: rgba(255,255,255,.015); border-left-color: transparent; }
.nowline { position: absolute; top: 22px; bottom: 0; border-left: 2px solid var(--text); }
.nowline::before { content: "now"; position: absolute; top: -18px; left: -12px; font-size: 10px; font-weight: 700; color: var(--text); }
.mk { position: absolute; top: 50%; transform: translate(-50%, -50%); z-index: 2; }
.mk.reset { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--ok); background: var(--bg); }
.mk.reset.proj { border-style: dotted; opacity: .7; }
.mk.credit { width: 11px; height: 11px; transform: translate(-50%, -50%) rotate(45deg); background: var(--warn); border-radius: 2px; }
.mk.used { width: 13px; height: 13px; transform: translate(-50%, -50%) rotate(45deg); background: var(--ok); border-radius: 2px; box-shadow: 0 0 0 2px var(--bg); }
.mk.lapse { width: 11px; height: 11px; transform: translate(-50%, -50%) rotate(45deg); border: 2px solid var(--bad); background: var(--bg); border-radius: 2px; }
.legend .mk.used, .legend .mk.lapse { transform: rotate(45deg); }
.ladder { margin: -4px 0 14px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel2); }
.lrow { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1.2fr) minmax(0, .8fr); gap: 10px; font-size: 12px; padding: 3px 0; color: var(--mut); }
.lrow.main { color: var(--text); font-weight: 600; }
.lrow.assume { font-style: italic; }
.lrow span:last-child { text-align: right; }
.bad-t { color: var(--bad); } .ok-t { color: var(--ok); }
.mk.drain { width: 3px; height: 16px; background: var(--bad); border-radius: 2px; }
.band { position: absolute; top: 7px; bottom: 7px; border-radius: 5px; font-size: 11px; font-weight: 600; display: flex; align-items: center; padding: 0 8px; white-space: nowrap; overflow: hidden; }
.band.bad { background: var(--badbg); color: var(--bad); border: 1px solid rgba(240,138,120,.4); }
.band.warn { background: var(--warnbg); color: var(--warn); border: 1px solid rgba(242,192,107,.35); }
.legend { display: flex; gap: 18px; flex-wrap: wrap; font-size: 12px; color: var(--mut); }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.legend .mk { position: static; transform: none; display: inline-block; }
.legend .mk.credit { transform: rotate(45deg); }

/* Tables */
.toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.seg { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; color: var(--mut); padding: 5px 11px; border-radius: 6px; font-size: 13px; font-weight: 550; }
.seg button[aria-pressed="true"] { background: var(--raise); color: var(--text); }
table.t { width: 100%; border-collapse: collapse; table-layout: fixed; }
table.t th { text-align: left; font-size: 11px; font-weight: 600; color: var(--dim); text-transform: uppercase; letter-spacing: .06em; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
table.t td { padding: 11px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
table.t tr.row { cursor: pointer; }
table.t tr.row:hover td { background: var(--panel2); }
table.t tr.row[aria-expanded="true"] td { background: var(--panel2); border-bottom-color: transparent; }
table.t .num { text-align: right; font-variant-numeric: tabular-nums; }
table.t tr.grp td { background: var(--bg); font-weight: 600; font-size: 12px; color: var(--mut); padding: 14px 12px 8px; cursor: default; }
.tw { overflow-x: auto; }
.detail td { background: var(--panel2); white-space: normal; padding: 4px 16px 18px; }
.dgrid { display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 24px; }
.dgrid h4 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin-bottom: 8px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 13px; }
.kv dt { color: var(--mut); } .kv dd { margin: 0; }
.models { display: flex; flex-wrap: wrap; gap: 5px; }
.models span { font-size: 11px; padding: 2px 7px; border-radius: 5px; background: var(--raise); color: var(--mut); font-family: ui-monospace, Consolas, monospace; }
.models span.down { color: var(--bad); background: var(--badbg); }
.dacts { display: flex; gap: 8px; flex-wrap: wrap; }
.who { display: flex; align-items: center; gap: 8px; min-width: 0; }
.who .nm { overflow: hidden; text-overflow: ellipsis; }
.sdot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.sdot.ok { background: var(--ok); } .sdot.warn { background: var(--warn); } .sdot.bad { background: var(--bad); } .sdot.neutral { background: var(--dim); }
td .sub { font-size: 11px; color: var(--dim); margin-top: 3px; }
td .sub.soon { color: var(--warn); }
.meter .track { position: relative; }
.mtick { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--text); opacity: .75; }
.pips { display: flex; align-items: center; gap: 4px; }
.pips i { width: 8px; height: 8px; transform: rotate(45deg); background: var(--warn); border-radius: 1px; margin-right: 2px; }
.pips b { margin-left: 4px; font-weight: 600; }
.warn-t { color: var(--warn); }
#acct-tables .card-h { flex-wrap: wrap; }

/* Usage */
.kpis { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; }
.kpi { padding: 16px; }
.kpi .v { font-size: 26px; font-weight: 650; letter-spacing: -.02em; margin-top: 4px; }
.kpi .s { font-size: 12px; color: var(--mut); }
.gap { display: flex; gap: 14px; align-items: center; padding: 12px 16px; border: 1px solid rgba(134,180,255,.3); background: var(--infobg); border-radius: var(--r); }
.gap p { margin: 0; font-size: 13px; color: var(--text); }
.gap .acts { margin-left: auto; display: flex; gap: 8px; }
.prog { height: 4px; border-radius: 4px; background: rgba(134,180,255,.2); margin-top: 7px; width: 260px; max-width: 100%; }
.prog i { display: block; height: 100%; border-radius: 4px; background: var(--info); }
.barlist { list-style: none; margin: 0; padding: 0; }
.barlist li { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 2fr) 70px; gap: 12px; align-items: center; padding: 8px 0; font-size: 13px; }
.barlist .lbl { display: flex; gap: 8px; align-items: center; min-width: 0; }
.barlist .lbl span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hbar { height: 18px; border-radius: 4px; position: relative; background: var(--panel2); }
.hbar i { position: absolute; inset: 0 auto 0 0; border-radius: 4px; opacity: .85; }
.hbar em { position: absolute; left: 8px; top: 0; line-height: 18px; font-style: normal; font-size: 11px; color: #0c131a; font-weight: 650; white-space: nowrap; }
.hbar em.out { color: var(--mut); }
.ends { display: flex; gap: 4px; align-items: flex-end; height: 30px; }
.ends i { width: 14px; background: var(--ok); border-radius: 2px 2px 0 0; opacity: .85; }
.ends i.lo { background: var(--warn); }

/* Policy */
.rules { margin: 0; padding: 0; list-style: none; counter-reset: r; }
.rules li { position: relative; padding: 0 0 12px 34px; font-size: 13px; color: var(--mut); }
.rules li b { color: var(--text); font-weight: 600; }
.rules li::before { counter-increment: r; content: counter(r); position: absolute; left: 0; top: -1px; width: 22px; height: 22px; border-radius: 50%; background: var(--raise); color: var(--text); font-size: 12px; font-weight: 650; display: grid; place-items: center; }
.card-b > dl { margin: 0; }
.setting { display: grid; grid-template-columns: 180px 1fr; gap: 16px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 13px; }
.setting:first-child { border-top: 0; }
.setting dt { color: var(--mut); } .setting dd { margin: 0; }
pre.code { margin: 8px 0 0; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px; font: 12px/1.5 ui-monospace, Consolas, monospace; color: #cfe0ee; overflow-x: auto; }
.toggle { width: 34px; height: 20px; border-radius: 20px; background: var(--line2); position: relative; flex: none; }
.toggle::after { content: ""; position: absolute; width: 14px; height: 14px; border-radius: 50%; background: var(--text); top: 3px; left: 3px; transition: left .15s; }
.toggle.on { background: var(--ok); } .toggle.on::after { left: 17px; background: #0c131a; }

/* Drawer */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 40; opacity: 0; pointer-events: none; transition: opacity .2s; }
.scrim.on { opacity: 1; pointer-events: auto; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 460px; max-width: 100%; z-index: 50; background: var(--panel); border-left: 1px solid var(--line2); transform: translateX(100%); transition: transform .22s ease; display: flex; flex-direction: column; }
.drawer.on { transform: none; }
.drawer-h { display: flex; align-items: center; padding: 18px 20px; border-bottom: 1px solid var(--line); }
.drawer-h h2 { font-size: 16px; }
.drawer-b { padding: 20px; overflow-y: auto; flex: 1; }
.steps { list-style: none; margin: 0; padding: 0; }
.step { display: grid; grid-template-columns: 28px 1fr; gap: 12px; padding-bottom: 22px; position: relative; }
.step:not(:last-child)::after { content: ""; position: absolute; left: 13px; top: 30px; bottom: 4px; border-left: 2px solid var(--line2); }
.step .n { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--raise); border: 1px solid var(--line2); font-size: 12px; font-weight: 700; color: var(--mut); }
.step.active .n { background: var(--text); color: #0c131a; border-color: var(--text); }
.step.done .n { background: var(--okbg); color: var(--ok); border-color: rgba(95,208,168,.4); }
.step h3 { font-size: 14px; margin-top: 4px; }
.step p { font-size: 13px; color: var(--mut); margin: 4px 0 10px; }
.step:not(.active) .body { display: none; }
.choice { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.choice button { text-align: left; border: 1px solid var(--line2); background: var(--panel2); border-radius: 10px; padding: 10px 12px; }
.choice button[aria-pressed="true"] { border-color: var(--text); }
.choice small { display: block; color: var(--mut); font-size: 12px; margin-top: 2px; }
input.field { width: 100%; background: var(--bg); border: 1px solid var(--line2); color: var(--text); border-radius: 8px; padding: 10px 12px; font: inherit; }
input.field:focus { outline: 2px solid var(--info); outline-offset: -1px; }
.hint { font-size: 12px; margin-top: 6px; min-height: 18px; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); background: var(--text); color: #0c131a; padding: 10px 16px; border-radius: 10px; font-size: 13px; font-weight: 550; opacity: 0; pointer-events: none; transition: all .2s; z-index: 60; max-width: calc(100% - 32px); box-shadow: 0 8px 30px rgba(0,0,0,.4); }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 1080px) {
  .span-7, .span-5, .span-6, .span-4, .span-8 { grid-column: span 12; }
  .kpis { grid-template-columns: repeat(2, 1fr); }
  .dgrid { grid-template-columns: 1fr; }
}
@media (max-width: 760px) {
  .bar-in { flex-wrap: wrap; height: auto; padding: 10px 16px 0; gap: 8px 12px; }
  nav.tabs { order: 3; width: calc(100% + 32px); margin: 0 -16px; padding: 0 8px; overflow-x: auto; height: 42px; border-top: 1px solid var(--line); }
  .fresh span.t { display: none; }
  main, #finish { padding-left: 16px; padding-right: 16px; }
  .att { grid-template-columns: 4px 1fr; }
  .att .acts { grid-column: 2; justify-content: flex-start; margin-top: 10px; }
  .att details { grid-column: 2; }
  .acct { grid-template-columns: minmax(0, 1fr) 90px 56px; }
  .acct .when { display: none; }
  .stats { grid-template-columns: 1fr; }
  .tl-row, .tl-axis { grid-template-columns: 96px 1fr; }
  .gridlines { left: 96px; }
  .hide-sm, .card-h .right.hide-sm { display: none; }
  .tick { display: none; }
  .tick:nth-child(3n+1) { display: block; }
  .kpis { grid-template-columns: 1fr 1fr; gap: 10px; }
  .kpi .v { font-size: 22px; }
  .gap { flex-direction: column; align-items: flex-start; }
  .gap .acts { margin-left: 0; }
  .setting { grid-template-columns: 1fr; gap: 4px; }
  #acct-tables table, #acct-tables tbody, #acct-tables tr, #acct-tables td { display: block; width: auto; }

</aside>
<div class="toast" id="toast" role="status"></div>
<script>
"use strict";

const label = (a) => String(a.email || a.id || "").replace(/\.(com|net|org|io)$/, "");

const modelWins = (a) => windows(a).filter((w) => !w.common);
const valueRow = (a) => (V?.accounts ?? []).find((x) => x.id === a.id);

const level = (u) => (u >= 100 ? "bad" : u >= 85 ? "warn" : "");
const cap = () => S.capacity?.providers ?? {};
const sc = (p) => cap()[p]?.scenarios ?? null;
function modelLimit(p, w) {
  const m = (V?.modelLimits ?? []).find((m) => m.provider === p && m.window === w.id && m.scope === w.scope);
  const kind = m?.kind === "cap" || m?.kind === "reserve" ? m.kind : "model limit";
  const share = kind !== "model limit" && Number.isFinite(m?.shareOfCommon) && m.shareOfCommon > 0 ? " (" + num(m.shareOfCommon * 100) + "% of all-models)" : "";

const providerIds = () => { const known = Object.keys(S.providers ?? {}); const seen = [...new Set(allAccounts().map((a) => a.provider))]; return ["claude", "codex", ...known, ...seen].filter((p, i, xs) => xs.indexOf(p) === i && (known.includes(p) || seen.includes(p))); };
const STATE = { conserve: ["bad", "Conserve"], spend: ["warn", "Spend"], normal: ["ok", "Normal"], unknown: ["neutral", "Unknown"] };

// data-* attributes carry every action; one delegated listener runs them, so no data ever lands in script.
function act(text, name, data = {}, opts = {}) {
  const attrs = Object.entries(data).map(([k, v]) => " data-" + k + '="' + esc(v) + '"').join("");
  return '<button type="button" class="btn ' + (opts.sm === false ? "" : "sm") + (opts.primary ? " primary" : "") + '" data-act="' + esc(name) + '"' + attrs + (opts.disabled ? " disabled" : "") + ">" + esc(text) + "</button>";

// Monthly price per account: the plan the provider reports, else the value report's (install.json planPrices).
function priceOf(a) {
  const p = a.plan?.price;
  if (p && Number.isFinite(p.usdPerMonth)) return { usd: p.usdPerMonth, source: p.source, detail: p.detail ?? "" };
  const v = valueRow(a);
  if (v && Number.isFinite(v.planUsdPerMonth)) return { usd: v.planUsdPerMonth, source: v.planPriceSource ?? "config", detail: "usageLedger.planPrices" };

const SOURCE_TEXT = { provider: "billed price reported by the provider", list: "list price for the plan tier the provider reports", config: "price set in install.json" };
function planCost(p) {
  const list = accounts(p), priced = list.map(priceOf).filter(Boolean);
  return { usd: priced.reduce((s, x) => s + x.usd, 0), count: priced.length, missing: list.length - priced.length, sources: [...new Set(priced.map((x) => x.source))] };
}
const planName = (a) => (a.plan?.label ? String(a.plan.label).replace(/^(ChatGPT|Claude) /, "") : ({ pro: "Pro", prolite: "Pro Lite", plus: "Plus", max: "Max" })[(String(a.id).match(/-(pro|prolite|plus|max)\.json$/) ?? [])[1]] ?? "");
// The router's own order (priority, highest first; a refill holder drained

function nextUp(p) {

function meter(u) {

/* ---------- Credit-aware projection ---------- */
// Why a banked credit lapses. A credit only refills its own account, and only

    (w.durationSeconds > 0 && ts(w.resetAt) + w.durationSeconds * 1000 < ts(l.at) ? "its own weekly resets (next " + day(w.resetAt) + ") keep refilling it" : "its own weekly reset on " + day(w.resetAt) + " refills it first");

      (on ? "" : '<div class="setting"><dt>Status</dt><dd>Automatic ' + esc(pname(p)) + " banked " + term(p) + "s: disabled (" + (S.resetAutomation === false ? "resetAutomation is false in state/pool-state.json" : "resetPolicy." + esc(p) + ".enabled is false") + ").</dd></div>") +
      '<div class="setting"><dt>What it does</dt><dd>' + (term(p) === "refill" ? "Clears usage but keeps the account's weekly reset date." : "Restarts the account's weekly window from now.") + "</dd></div>" +
      '<div class="setting"><dt>Fires when</dt><dd>Every ' + esc(pname(p)) + " account is " + lvl + " on " + (c.trigger === "weekly" ? "the all-models weekly limit" : "any limit") + "</dd></div>" +
      '<div class="setting"><dt>Before a credit lapses</dt><dd>' + (c.redeemBeforeLapse ? "Redeem early on an account at the threshold when the forecast says the credit would expire unused" : "Off") + "</dd></div>" +
      (term(p) === "refill" ? '<div class="setting"><dt>Runway rule</dt><dd>Used only on an account with time to use the refill up before its reset date at the lowest recent demand (never more than ' + esc(c.maxRunwayPercent ?? 50) + "% of the week; " + esc(c.maxRunwayPercent ?? 50) + "% while demand is unknown), unless the credit expires before that date anyway</dd></div>" : "") +
      (S.resets?.[p]?.error ? '<div class="setting"><dt>Last attempt</dt><dd style="color:var(--bad)">Failed ' + esc(dt(S.resets[p].error.at)) + ": " + esc(S.resets[p].error.message) + "</dd></div>" : "") +
      '<div class="setting"><dt>Last used</dt><dd>' + (last ? esc(dt(last.at)) + " on " + esc(la ? label(la) : last.accountId) + (last.trigger ? ' <span class="dim">(' + esc(last.trigger) + ")</span>" : "") + ' <span class="chip neutral" style="margin-left:4px">' + esc(last.outcome) + "</span>" : '<span class="dim">never</span>') + "</dd></div>" +
      (c.problems?.length ? '<div class="setting"><dt>Config problems</dt><dd style="color:var(--bad)">' + esc(c.problems.join("; ")) + "</dd></div>" : "") +
      "</dl></div></div>";
  };
  const bal = S.capacity?.balance;
  const ep = (path, what) => '<tr><td style="white-space:normal"><code>' + path + '</code></td><td style="white-space:normal">' + what + "</td></tr>";
  return '<div class="grid">' +
    '<div class="card span-12"><div class="card-h"><h2>How sessions are routed</h2></div><div class="card-b"><ol class="rules">' +
    '<li><b>New sessions go to the available account whose weekly window resets soonest</b>, until it is drained. That account is marked <span class="next">next</span>.</li>' +
    "<li><b>Short windows and model caps spill over.</b> The proxy enforces 5-hour limits and model caps such as Fable (a cap inside the all-models quota, not extra quota) and moves that request to the next account.</li>" +
    "<li><b>Sessions are sticky.</b> Active sessions stay on their account; sessions idle for over an hour rebind.</li>" +
    "<li><b>The client picks the provider.</b> The pool routes among accounts of the provider a request names and never moves requests across providers. The capacity forecast publishes a balance signal (now: " + esc(bal?.toward ? "toward " + pname(bal.toward) + ", step " + bal.steps + " of " + bal.maxSteps : "none") + ") on <code>/api/capacity</code> for lane dispatchers; nothing in the pool enforces it.</li>" +
    "</ol></div></div>" +
    card("claude") + card("codex") +
    '<div class="card span-6"><div class="card-h"><h2>Which credit goes first</h2></div><div class="card-b"><ol class="rules"><li><b>Credits expiring within 24 hours</b> are used first.</li><li>Otherwise the account whose <b>natural weekly reset is furthest away</b>.</li><li>A refused credit <b>waits</b> while other accounts stay eligible.</li></ol></div></div>' +
    '<div class="card span-6" id="config"><div class="card-h"><h2>Configuration</h2></div><div class="card-b"><dl>' +
    '<div class="setting" style="border:0;padding-top:0"><dt>Plan prices</dt><dd>Read from each provider twice a day. Codex: the subscription and ChatGPT\'s own price table (billed price). Claude: Anthropic reports the tier (Max 20x) but not the price to Claude Code sign-ins, so the claude.com list price for that tier is used. To override, set USD per month under <code>usageLedger.planPrices</code> in <code>state/install.json</code>; an override beats a list price, not a provider-billed one.</dd></div>' +
    '<div class="setting"><dt>Credit automation</dt><dd><code>resetPolicy</code> in <code>state/install.json</code>; master switch <code>resetAutomation</code> in <code>state/pool-state.json</code> (' + (S.resetAutomation ? "on" : "off") + ").</dd></div>" +
    '<div class="setting"><dt>Cadence</dt><dd>Usage every 2 minutes; plans twice a day; value report hourly' + (V?.generatedAt ? " (last " + esc(ago(V.generatedAt)) + ")" : "") + ".</dd></div>" +
    "</dl></div></div>" +
    '<div class="card span-12" id="agents"><div class="card-h"><h2>Agent access</h2><span class="right mut" style="font-size:12px">read-only, no tokens</span></div><div class="card-b"><p class="mut" style="margin:0 0 10px;font-size:13px">Agents and scripts on this machine read the same data this page shows. From WSL use the Windows host address on port 8318.</p><div class="tw"><table class="t"><thead><tr><th style="width:34%">Endpoint</th><th>What it returns</th></tr></thead><tbody>' +
    ep("GET http://127.0.0.1:8318/api/summary", "One compact document: per provider cost, credits, forecast with three scenarios (resets only, banked credits, +1 credit/week) and per-account plan, price, windows and credit expiries. Start here.") +
    ep("GET /api/status", "Full live pool state: accounts, windows, routing, reset journal, policies.") +
    ep("GET /api/capacity", "capacity-forecast/v1 (also <code>state/capacity-forecast.json</code>): states, balance signal, projections, scenarios.") +
    ep("GET /api/value", "usage-value/v1 (also <code>state/usage-value.json</code>): API-equivalent dollars, quota rates, value vs plan.") +
    "</tbody></table></div></div></div>" +
    "</div>";
}
/* ---- I/O below: DOM, fetch, sign-in ---- */
const $ = (id) => document.getElementById(id);
let filter = "all", openRow = null, offline = false;
let toastTimer;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("on"), 4200);
}
function keepOpen(el, html) {
  const open = new Set([...el.querySelectorAll("details[open]")].map((d) => d.dataset.key));
  el.innerHTML = html;
  for (const d of el.querySelectorAll("details")) if (open.has(d.dataset.key)) d.open = true;
}
function renderAll() {
  NOW = Date.now();
  const items = attentionItems();
  keepOpen($("attention"), attentionHtml(items));
  $("att-count").textContent = items.filter((i) => i.sev !== "info").length || "";
  for (const p of ["claude", "codex"]) $("prov-" + p).innerHTML = providerHtml(p);
  $("timeline").innerHTML = timelineHtml();
  $("v-accounts").innerHTML = accountsHtml(filter, openRow);
  $("v-usage").innerHTML = usageHtml();
  $("v-policy").innerHTML = policyHtml();
  const age = S.checkedAt ? NOW - Date.parse(S.checkedAt) : Infinity;
  $("fresh").className = "fresh" + (offline || S.error || age > 6 * 6e4 ? " bad" : "");
  $("fresh").innerHTML = '<span class="pulse"></span><span class="t">' + esc(offline ? "Service unavailable" + (S.checkedAt ? "; showing " + clock(S.checkedAt) : "") : S.error ? S.error : "Checked " + clock(S.checkedAt)) + "</span>";
  renderFinish();
}
async function post(route, data = {}) {
  const r = await fetch("/api/" + route, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Error(j.error || "Request failed");
  return j;
}
let loaded = false;
async function status() {
  try {
    const r = await fetch("/api/status");
    if (!r.ok) throw Error();
    S = await r.json();
    offline = false;
    loaded = true;
    checkPendingSignin(S);
  } catch {
    offline = true;
  }
  if (loaded || offline) renderAll();
}
async function loadValue() {
  try { const r = await fetch("/api/value"); V = r.ok ? await r.json() : null; } catch { V = null; }
  if (loaded) renderAll();
}
async function refreshNow() {
  try { await post("refresh"); toast("Refreshing provider usage..."); setTimeout(status, 4000); } catch (e) { toast(e.message); }
}

/* ---------- Sign-in drawer: choose provider, open sign-in, finish (here or from another device) ---------- */
const callbackProvider = { claude: "anthropic", codex: "codex" };
const callbackPorts = { 54545: "claude", 1455: "codex" };
const signinName = (p) => (p === "codex" ? "ChatGPT (Codex)" : "Claude");
let si = { step: 1, provider: null, accountId: null, url: null };
function pendingSignin() {
  try { const p = JSON.parse(localStorage.getItem("pendingSignin")); return p && Date.now() - p.startedAt < 15 * 60e3 ? p : null; } catch { return null; }
}
function setMsg(text, kind) { const m = $("si-msg"); if (m) { m.textContent = text; m.style.color = kind === "bad" ? "var(--bad)" : kind === "ok" ? "var(--ok)" : ""; } }
function renderFinish() {
  const p = pendingSignin(), el = $("finish");
  el.hidden = !p || $("drawer").classList.contains("on");
  if (p) el.innerHTML = '<div class="gap"><div><p><b>Finish ' + esc(signinName(p.provider)) + ' sign-in.</b> <span class="mut">On this PC it finishes by itself. Signed in on another device? Paste the localhost link it opened.</span></p></div><div class="acts">' + act("Finish sign-in", "si-resume", {}, { primary: true }) + act("Cancel", "si-cancel") + "</div></div>";
}
function openSignin(provider, accountId) {
  const p = pendingSignin();
  si = { step: provider ? 2 : 1, provider: provider ?? null, accountId: accountId ?? null, url: null };
  if (!provider && p) si = { step: 3, provider: p.provider, accountId: null, url: null };
  renderSignin();
  $("scrim").classList.add("on"); $("drawer").classList.add("on");
  renderFinish();
}
function closeSignin() { $("scrim").classList.remove("on"); $("drawer").classList.remove("on"); renderFinish(); }
function renderSignin() {
  const acct = si.accountId && allAccounts().find((a) => a.id === si.accountId);
  $("dr-title").textContent = acct ? "Sign in again" : "Connect an account";
  const name = signinName(si.provider);
  const cls = (n) => "step" + (si.step === n ? " active" : si.step > n ? " done" : "");
  const steps = [
    ["Choose provider", si.provider ? esc(name) : "", '<div class="choice">' + ["claude", "codex"].map((p) => '<button type="button" data-act="si-provider" data-p="' + p + '" aria-pressed="' + (si.provider === p) + '"><span class="pdot ' + p + '"></span> ' + esc(pname(p)) + "<small>" + accounts(p).length + " connected</small></button>").join("") + "</div>"],
    ["Sign in with " + name, acct ? "as " + esc(acct.email) : "",
      (acct ? '<p>Use <b style="color:var(--text)">' + esc(acct.email) + "</b> on the provider page.</p>" : "") + "<p>Opens the provider's page in a new tab. Finish one sign-in before starting another.</p>" +
      (si.url ? '<a class="btn primary" target="_blank" rel="noopener" href="' + esc(si.url) + '">Continue to ' + esc(si.provider === "codex" ? "ChatGPT" : "Claude") + " sign-in</a>" : act("Open " + name + " sign-in", "si-open", {}, { primary: true, sm: false }))],
    ["Finish", "", (si.url ? '<p><a class="btn sm" target="_blank" rel="noopener" href="' + esc(si.url) + '">Open the sign-in page</a></p>' : "") + '<p>On this PC the sign-in finishes by itself; keep this panel open to see it confirmed.</p><p>On a phone or another device, the browser ends on a localhost page that will not load. That is expected: copy its address and paste it here.</p><input class="field" id="cb" autocomplete="off" placeholder="http://localhost:' + (si.provider === "codex" ? 1455 : 54545) + '/callback?code=..." /><div style="display:flex;gap:8px;margin-top:8px">' + act("Paste from clipboard", "si-paste") + act("Submit link", "si-submit") + act("Cancel sign-in", "si-cancel") + "</div>"],
  ];
  $("steps").innerHTML = steps.map(([h, sub, body], i) => '<li class="' + cls(i + 1) + '"><span class="n">' + (si.step > i + 1 ? "&#10003;" : i + 1) + "</span><div><h3>" + esc(h) + (sub ? ' <span class="mut" style="font-weight:400">' + sub + "</span>" : "") + '</h3><div class="body">' + body + "</div></div></li>").join("") +
    '<li class="step"><span class="n"></span><div><p class="hint" id="si-msg" role="status" aria-live="polite"></p></div></li>';
}
async function login() {
  const provider = si.provider;
  setMsg("Preparing " + signinName(provider) + " sign-in...");
  try {
    const j = await post("login", { provider });
    const u = j.url ?? j.auth_url;
    if (!u) throw Error("Sign-in URL unavailable");
    localStorage.setItem("pendingSignin", JSON.stringify({
      provider, startedAt: Date.now(),
      accounts: accounts(provider).map((a) => a.id),
      reauth: Object.entries(S.reauth ?? {}).filter(([, v]) => v?.provider === provider).map(([id]) => id),
    }));
    si.url = u;
    si.step = 3;
    renderSignin();
    const w = window.open(u, "_blank");
    if (w) w.opener = null;
    setMsg(w ? "Complete " + signinName(provider) + " sign-in in the new tab." : "The browser blocked the new tab: use Open the sign-in page above.");
    waitForSignin(provider);
  } catch (e) { setMsg(e.message, "bad"); }
}
// Done once one of the accounts that needed sign-in no longer does, or a new account of that provider appears.
function checkPendingSignin(s) {
  const p = pendingSignin();
  if (!p || !s) return false;
  const list = (s.accounts ?? []).filter((a) => a.provider === p.provider);
  const added = list.find((a) => !p.accounts.includes(a.id));
  const cleared = p.reauth.filter((id) => !s.reauth?.[id]);
  if (!added && !cleared.length) return false;
  const who = added ? added.email || added.id : cleared.map((id) => list.find((a) => a.id === id)?.email || id).join(", ");
  localStorage.removeItem("pendingSignin");
  const msg = "Signed in: " + who + " is connected" + (added ? "" : " again") + ".";
  if ($("drawer").classList.contains("on")) setMsg(msg, "ok");
  toast(msg);
  return true;
}
let waiting = false;
async function waitForSignin(provider) {
  if (waiting) return;
  waiting = true;
  try {
    for (let i = 0; i < 24 && pendingSignin(); i++) {
      if (i % 4 === 0) post("refresh").catch(() => {});
      await new Promise((r) => setTimeout(r, i ? 7500 : 3000));
      await status();
    }
    if (pendingSignin()) setMsg(signinName(provider) + " sign-in not confirmed yet. If you signed in on another device, paste the localhost link above; otherwise start again.");
  } finally { waiting = false; }
}
let finishing = false;
async function finishSignin(raw) {
  if (finishing) return;
  let u;
  try { u = new URL(String(raw ?? "").trim()); } catch { setMsg("That is not the sign-in link. Copy the full address of the localhost page the provider opened.", "bad"); return; }
  if (!/^(localhost|127\.0\.0\.1)$/.test(u.hostname)) { setMsg("That is not the localhost sign-in link.", "bad"); return; }
  if (u.searchParams.get("error")) { setMsg("The provider refused the sign-in: " + (u.searchParams.get("error_description") || u.searchParams.get("error")) + ". Start again.", "bad"); return; }
  if (!u.searchParams.get("code")) { setMsg("That link has no sign-in code. Copy the full address of the localhost page the provider opened.", "bad"); return; }
  const pending = pendingSignin();
  const provider = callbackPorts[u.port] ?? pending?.provider ?? si.provider;
  if (!provider) { setMsg("Choose a provider and open its sign-in first.", "bad"); return; }
  finishing = true;
  setMsg("Finishing " + signinName(provider) + " sign-in...");
  try {
    await post("callback", { provider: callbackProvider[provider], redirect_url: u.href });
    if ($("cb")) $("cb").value = "";
    if (pending?.provider === provider) { setMsg(signinName(provider) + " sign-in submitted; waiting for the account to reconnect..."); waitForSignin(provider); }
    else setMsg(signinName(provider) + " sign-in submitted. The account shows up after the next refresh.", "ok");
  } catch (e) { setMsg(e.message, "bad"); } finally { finishing = false; }
}

/* ---------- Shell ---------- */
function go(view, anchor) {
  if (!["overview", "accounts", "usage", "policy"].includes(view)) view = "overview";
  if (location.hash !== "#" + view) history.replaceState(null, "", "#" + view);
  for (const s of document.querySelectorAll("section.view")) s.classList.toggle("on", s.id === "v-" + view);
  for (const a of document.querySelectorAll("#tabs a")) { if (a.dataset.v === view) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); }
  window.scrollTo(0, 0);
  if (anchor) setTimeout(() => $(anchor)?.scrollIntoView({ block: "start" }), 30);
}
function showAccount(id) { filter = "all"; openRow = id; renderAll(); go("accounts"); setTimeout(() => document.querySelector('tr[data-id="' + CSS.escape(id) + '"]')?.scrollIntoView({ block: "center" }), 30); }
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const d = el.dataset;
  switch (d.act) {
    case "go": go(d.v, d.anchor); break;
    case "jump": go("overview"); setTimeout(() => $(d.id)?.scrollIntoView({ block: "start" }), 30); break;
    case "account": showAccount(d.id); break;
    case "credits": filter = "credits"; openRow = accounts(d.p).filter((a) => a.creditCount > 0 && a.nextCreditExpiry).sort((x, y) => ts(x.nextCreditExpiry) - ts(y.nextCreditExpiry))[0]?.id ?? null; renderAll(); go("accounts"); break;
    case "filter": filter = d.v; $("v-accounts").innerHTML = accountsHtml(filter, openRow); break;
    case "row": openRow = openRow === d.id ? null : d.id; $("v-accounts").innerHTML = accountsHtml(filter, openRow); document.querySelector('tr[data-id="' + CSS.escape(d.id) + '"]')?.focus(); break;
    case "refresh": refreshNow(); break;
    case "signin": openSignin(d.p, d.id); break;
    case "si-provider": si.provider = d.p; si.step = 2; si.url = null; renderSignin(); break;
    case "si-open": login(); break;
    case "si-resume": openSignin(); break;
    case "si-cancel": localStorage.removeItem("pendingSignin"); si = { step: 1, provider: null, accountId: null, url: null }; renderSignin(); setMsg("Sign-in cancelled."); renderFinish(); break;
    case "si-close": closeSignin(); break;
    case "si-submit": finishSignin($("cb")?.value); break;
    case "si-paste": navigator.clipboard?.readText ? navigator.clipboard.readText().then(finishSignin, () => { setMsg("This browser did not allow reading the clipboard. Paste the link into the box."); $("cb")?.focus(); }) : $("cb")?.focus(); break;
  }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && $("drawer").classList.contains("on")) closeSignin();
  const row = e.target.closest?.('tr[data-act="row"]');
  if (row && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); row.click(); }
});
document.addEventListener("input", (e) => {
  if (e.target.id === "cb" && /^https?:\/\/(localhost|127\.0\.0\.1)(:\d+)?\/\S*[?&](code|error)=/.test(e.target.value.trim())) finishSignin(e.target.value);
});
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { status(); renderFinish(); } });
window.addEventListener("hashchange", () => go(location.hash.slice(1) || "overview"));
go(location.hash.slice(1) || "overview");
status();
loadValue();
setInterval(status, 15000);
setInterval(loadValue, 300000);
</script>
